<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#070806" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="BOX Jardim Silvina" />
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
        <title>Treinador · BOX Jardim Silvina</title>
        <link rel="icon" type="image/png" href="assets/images/kettlebell.png">
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/auth.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/dashboard.css" />
        <link rel="stylesheet" href="css/admin.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <link rel="stylesheet" href="css/polish.css" />
        <script src="js/motion.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
            }
        </script>
    </head>
    <body>
        <main class="auth" id="login">
            <h1>Área do treinador</h1>
            <section class="card">
                <form id="form" novalidate>
                    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required />
                    <label for="password">Senha</label
                    ><input id="password" type="password" autocomplete="current-password" required />
                    <button class="btn btn-primary" id="btn" type="submit" style="margin-top: 1.1rem">
                        <i class="fa-solid fa-lock"></i> Entrar
                    </button>
                </form>
            </section>
        </main>
        <div class="admin hidden" id="panel">
            <header style="display: flex; justify-content: space-between; align-items: center">
                <h1>Treinador</h1>
                <button class="link" id="logout">Sair</button>
            </header>
            <nav class="tabbar tabs" role="tablist" aria-label="Áreas do treinador">
                <button class="tab" role="tab" data-tab="treinos" aria-selected="true">Treinos</button>
                <button class="tab" role="tab" data-tab="individual" aria-selected="false">Individual</button>
                <button class="tab" role="tab" data-tab="presenca" aria-selected="false">Presença</button>
                <button class="tab" role="tab" data-tab="game" aria-selected="false">Gamificação</button>
                <button class="tab" role="tab" data-tab="eventos" aria-selected="false">Eventos</button>
                <button class="tab" role="tab" data-tab="loja" aria-selected="false">Loja</button>
            </nav>
            <div id="adm-view" aria-live="polite" style="display: grid; gap: 0.8rem"></div>
        </div>
        <dialog id="dlg" aria-label="Formulário"></dialog>
        <div id="toasts" aria-live="polite"></div>
        <script type="module" src="js/admin.js"></script>
    </body>
</html>
